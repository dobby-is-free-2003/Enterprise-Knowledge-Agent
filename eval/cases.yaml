# ---------------------------------------------------------------- SQL questions (answer must equal ground truth)
- {id: q01, cat: sql, split: dev,  user: anita.desai, q: "How many customers are in the north region?", status: answered, truth: "SELECT COUNT(*) FROM customers WHERE region = 'north'"}
- {id: q02, cat: sql, split: test, user: anita.desai, q: "How many enterprise customers are there?", status: answered, truth: "SELECT COUNT(*) FROM customers WHERE tier = 'enterprise'"}
- {id: q03, cat: sql, split: dev,  user: anita.desai, q: "How many critical priority tickets are open?", status: answered, truth: "SELECT COUNT(*) FROM tickets WHERE status = 'open' AND priority = 'critical'"}
- {id: q04, cat: sql, split: test, user: meera.iyer, q: "How many open tickets are there?", status: answered, truth: "SELECT COUNT(*) FROM tickets WHERE status = 'open'"}
- {id: q05, cat: sql, split: dev,  user: karan.mehta, q: "What is the total order amount for Zenith Retail?", status: answered, truth: "SELECT ROUND(SUM(o.amount_inr), 2) FROM orders o JOIN customers c ON c.id = o.customer_id WHERE c.name = 'Zenith Retail'"}
- {id: q06, cat: sql, split: test, user: karan.mehta, q: "What is the average order value?", status: answered, truth: "SELECT ROUND(AVG(amount_inr), 2) FROM orders"}
- {id: q07, cat: sql, split: dev,  user: vikram.rao, q: "What is the total revenue?", status: answered, truth: "SELECT ROUND(SUM(amount_inr), 2) FROM orders WHERE status = 'paid'"}
- {id: q08, cat: sql, split: test, user: karan.mehta, q: "Top 3 customers by total order value", status: answered, truth: "SELECT c.name, ROUND(SUM(o.amount_inr), 2) FROM customers c JOIN orders o ON o.customer_id = c.id GROUP BY c.id ORDER BY 2 DESC, c.name LIMIT 3"}


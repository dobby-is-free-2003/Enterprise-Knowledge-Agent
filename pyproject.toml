[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-agent"
version = "0.1.0"
description = "Permission-aware enterprise knowledge agent on Google ADK and Gemini (free-tier friendly)"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "httpx",
  "numpy",
  "pyyaml",
  "qdrant-client",
  "google-genai",
  "google-adk",
  "google-api-python-client",
  "google-auth",
  "google-auth-oauthlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
eka = "eka.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eka = ["web/*", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
